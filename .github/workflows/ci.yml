# CI on every PR and every push to the default branch.
# Draft PRs are skipped (draft until green); marking a PR ready runs the checks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancelled: a push run finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check scripts, test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: |
          find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: Test
        run: npm test
